name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run tests
        run: go test ./...
        working-directory: backend

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            hasandotx/envito:latest
            hasandotx/envito:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: |
            hasandotx/envito-frontend:latest
            hasandotx/envito-frontend:${{ github.sha }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key docker-compose.prod.yml ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }}:/home/deployer/envito/docker-compose.prod.yml

      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          HEALTHZ_TOKEN: ${{ secrets.HEALTHZ_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          envs: IMAGE_TAG,DB_URL,CLERK_SECRET_KEY,REDIS_URL,OTP_SECRET,RESEND_API_KEY,EMAIL_FROM,APP_PUBLIC_URL,HEALTHZ_TOKEN,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,R2_PUBLIC_URL,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            cat > /home/deployer/envito/Caddyfile << CADDYEOF
            envitoo.mnah.dev {
                reverse_proxy frontend:80 {
                    header_up X-Forwarded-For {remote_host}
                }
            }
            CADDYEOF

            cat > /home/deployer/envito/backend/.env << ENVEOF
            DB_URL=${DB_URL}
            CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
            REDIS_URL=${REDIS_URL}
            OTP_SECRET=${OTP_SECRET}
            RESEND_API_KEY=${RESEND_API_KEY}
            EMAIL_FROM=${EMAIL_FROM}
            APP_PUBLIC_URL=${APP_PUBLIC_URL}
            HEALTHZ_TOKEN=${HEALTHZ_TOKEN}
            R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            R2_BUCKET_NAME=${R2_BUCKET_NAME}
            R2_PUBLIC_URL=${R2_PUBLIC_URL}
            ENVEOF
            chmod 600 /home/deployer/envito/backend/.env

            cd /home/deployer/envito
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
