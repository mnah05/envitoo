name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run tests
        run: go test ./...
        working-directory: backend

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            hasandotx/envito:latest
            hasandotx/envito:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: |
            hasandotx/envito-frontend:latest
            hasandotx/envito-frontend:${{ github.sha }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: envitoo-github-deploy

      - name: Prepare deployment bundle
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          R2_CREDENTIALS_FRESH: ${{ vars.R2_CREDENTIALS_FRESH }}
          ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ "$R2_CREDENTIALS_FRESH" != "yes" ]; then
            echo "::error::Fresh R2 credentials are not configured; refusing to deploy with old R2 secrets."
            exit 1
          fi
          test -n "$ARTIFACT_BUCKET"
          test -n "$EC2_INSTANCE_ID"
          test -n "$POSTGRES_PASSWORD"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

          mkdir -p backend
          {
            printf 'POSTGRES_USER=envitoo\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=envitoo\n'
            printf 'DB_URL=postgresql://envitoo:%s@postgres:5432/envitoo?sslmode=disable\n' "$POSTGRES_PASSWORD"
            printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY"
            printf 'OTP_SECRET=%s\n' "$OTP_SECRET"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
            printf 'APP_PUBLIC_URL=%s\n' "$APP_PUBLIC_URL"
            printf 'R2_ACCOUNT_ID=%s\n' "$R2_ACCOUNT_ID"
            printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET_NAME=%s\n' "$R2_BUCKET_NAME"
            printf 'R2_PUBLIC_URL=%s\n' "$R2_PUBLIC_URL"
          } > backend/.env
          {
            printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
            printf 'DOCKERHUB_TOKEN=%s\n' "$DOCKERHUB_TOKEN"
          } > deploy-registry.env
          chmod 600 backend/.env deploy-registry.env

          tar -czf deploy-bundle.tar.gz docker-compose.prod.yml Caddyfile scripts/deploy-ec2.sh backend/.env backend/supabase/migrations deploy-registry.env
          aws s3 cp deploy-bundle.tar.gz "s3://$ARTIFACT_BUCKET/releases/${GITHUB_SHA}.tar.gz" --sse AES256

          remote_script="set -euo pipefail
          mkdir -p /home/ec2-user/envitoo
          aws s3 cp s3://$ARTIFACT_BUCKET/releases/${GITHUB_SHA}.tar.gz /tmp/envitoo-deploy.tar.gz
          tar -xzf /tmp/envitoo-deploy.tar.gz -C /home/ec2-user/envitoo
          chown -R ec2-user:ec2-user /home/ec2-user/envitoo
          chmod 600 /home/ec2-user/envitoo/backend/.env /home/ec2-user/envitoo/deploy-registry.env
          sudo -u ec2-user env IMAGE_TAG=${GITHUB_SHA} bash /home/ec2-user/envitoo/scripts/deploy-ec2.sh"
          parameters=$(jq -n --arg command "$remote_script" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "EnviToo deploy ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query 'StandardOutputContent' --output text
