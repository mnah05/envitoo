services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: envitoo
      POSTGRES_PASSWORD: envitoo
      POSTGRES_DB: envitoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envitoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep nats-server | grep -v grep"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DB_URL: postgresql://envitoo:envitoo@postgres:5432/envitoo
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    profiles:
      - full

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    profiles:
      - full

  mail-worker:
    build:
      context: ./backend
    command: ["/usr/local/bin/mailer"]
    env_file:
      - ./backend/.env
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep mailer | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  nats_data:
