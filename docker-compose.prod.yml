services:
  backend:
    image: hasandotx/envito:${IMAGE_TAG:-latest}
    build: !reset null

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - full

  mail-worker:
    image: hasandotx/envito:${IMAGE_TAG:-latest}
    build: !reset null
    command: ["/mailer"]
    env_file:
      - ./backend/.env
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep mailer | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - full
