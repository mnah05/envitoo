services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep nats-server | grep -v grep"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: hasandotx/envito:${IMAGE_TAG:-latest}
    build: !reset null
    env_file:
      - ./backend/.env
    environment:
      NATS_URL: nats://nats:4222

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - full

  mail-worker:
    image: hasandotx/envito:${IMAGE_TAG:-latest}
    build: !reset null
    command: ["/usr/local/bin/mailer"]
    env_file:
      - ./backend/.env
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep mailer | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - full
