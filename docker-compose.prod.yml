services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 50m
    mem_reservation: 20m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    mem_limit: 100m
    mem_reservation: 50m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    mem_limit: 150m
    mem_reservation: 80m
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep nats-server | grep -v grep"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    image: hasandotx/envito:${IMAGE_TAG:-latest}
    build: !reset null
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NATS_URL: nats://nats:4222
    mem_limit: 250m
    mem_reservation: 128m
  frontend:
    image: hasandotx/envito-frontend:${IMAGE_TAG:-latest}
    build: !reset null
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 50m
    mem_reservation: 20m
  mail-worker:
    image: hasandotx/envito:${IMAGE_TAG:-latest}
    build: !reset null
    command: ["/usr/local/bin/mailer"]
    env_file:
      - ./backend/.env
    environment:
      NATS_URL: nats://nats:4222
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 100m
    mem_reservation: 50m
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep mailer | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  caddy_data:
  caddy_config:
  redis_data:
  nats_data: