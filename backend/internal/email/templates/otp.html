<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnviToo</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#71717a;">EnviToo</td>
          </tr>
          <tr>
            <td style="padding:8px 28px 0;font-size:22px;font-weight:700;line-height:1.3;">Your verification code</td>
          </tr>
          <tr>
            <td style="padding:12px 28px 0;font-size:15px;line-height:1.55;color:#3f3f46;">
              {{if .Name}}Hi {{.Name}},{{else}}Hi,{{end}} use this code to finish registering for <strong>{{.EventTitle}}</strong>. It expires in 10 minutes.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px;">
              <div style="display:inline-block;padding:14px 22px;border-radius:10px;background:#f4f4f5;font-size:28px;font-weight:700;letter-spacing:0.28em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{.OTP}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;font-size:13px;line-height:1.5;color:#71717a;">
              If you did not request this, you can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
