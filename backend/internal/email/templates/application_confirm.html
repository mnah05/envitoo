<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnviToo</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:#71717a;">EnviToo</td>
          </tr>
          <tr>
            <td style="padding:8px 28px 0;font-size:22px;font-weight:700;line-height:1.3;">Volunteer application received</td>
          </tr>
          <tr>
            <td style="padding:12px 28px 28px;font-size:15px;line-height:1.55;color:#3f3f46;">
              {{if .Name}}Hi {{.Name}},{{else}}Hi,{{end}} we received your application for <strong>{{.RoleName}}</strong> at <strong>{{.EventTitle}}</strong>. We'll notify you when there's an update.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
